on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main*
    tags:
      - 'v*'
name: Build and Publish Docker Image
env:
  IMAGE: ghcr.io/obolnetwork/goteth
jobs:
  # One native runner per arch (no QEMU emulation), each pushing its image by
  # digest; merge then creates the multi-arch manifest with the usual tags.
  build-docker:
    name: Build Docker Image (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
        fetch-depth: 0
        submodules: 'recursive'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Github container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        build-args: |
          GITHUB_SHA=${{ github.sha }}
          GO_BUILD_FLAG=${{ env.GO_BUILD_FLAG }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        # No attestation manifests (they show as unknown/unknown arch in ghcr).
        provenance: false
        cache-from: type=gha,scope=goteth-${{ matrix.arch }}
        cache-to: type=gha,scope=goteth-${{ matrix.arch }},mode=max

    - name: Export digest
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    needs: build-docker
    runs-on: ubuntu-24.04
    name: Merge Docker Manifests
    steps:
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Define docker image meta data tags
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ env.IMAGE }}
        tags: |
          # Tag "git short sha" on all git events
          type=sha,prefix=

          # Tag "next" on git-push-to-main-branch events
          type=raw,value=next,event=branch,enable={{is_default_branch}}

          # Tag "latest" on git-tag events
          type=raw,value=latest,event=tag

          # Tag "tag ref" on git-tag events
          type=ref,event=tag

    - name: Login to Github container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest and push
      working-directory: ${{ runner.temp }}/digests
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        tags=()
        while read -r tag; do
          if [[ -n "${tag}" ]]; then tags+=(-t "${tag}"); fi
        done <<< "${TAGS}"
        # shellcheck disable=SC2046 # one source arg per digest file
        docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE}@sha256:%s " *)
        docker buildx imagetools inspect "${tags[1]}"

# Bring back the branch